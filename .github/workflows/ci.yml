name: Offline tests

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      VIDEOMIND_TEST_SPEECH_MODEL: .cache/models/faster-whisper-tiny
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install FFmpeg and fonts on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Verify media tools
        run: python -c "import shutil; assert all(shutil.which(x) for x in ('ffmpeg', 'ffprobe'))"
      - name: Install project and optional test dependencies
        run: python -m pip install -e ".[dev,download,speech,ocr]"
      - name: Prepare public tiny speech model
        run: python -m videomind prepare-speech --size tiny
      - name: Run all offline tests without skips
        run: python scripts/run_ci_tests.py
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Check types
        run: python -m mypy
      - name: Build distributions
        run: python -m build
