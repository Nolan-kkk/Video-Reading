[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "videomind"
version = "0.2.1"
description = "Local BYOK video-to-Markdown engine"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6.0.1,<7", "httpx>=0.28,<1"]

[project.optional-dependencies]
download = ["yt-dlp>=2026.10.26,<2027"]
speech = ["faster-whisper>=1.2.1,<1.3"]
ocr = ["rapidocr>=3.10,<3.11", "onnxruntime>=1.20,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-PyYAML>=6,<7", "build>=1,<2", "Pillow>=11,<13"]

[project.scripts]
videomind = "videomind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
videomind = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".cache", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/videomind"]

